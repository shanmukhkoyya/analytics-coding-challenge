name: Inspect household energy workbook

on:
  push:
    branches: [main]
    paths:
      - "Day-02-Household-Energy-Consumption-Analysis/Day-02-Household_Energy_Analysis.xlsx"
      - "scripts/inspect_household_energy.py"
      - ".github/workflows/inspect-household-energy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-workbook:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook reader
        run: python -m pip install openpyxl
      - name: Inspect workbook sheets and values
        run: python scripts/inspect_household_energy.py
